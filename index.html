<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First-Year Law Mock Exam — Challenging Independent Practice</title>
<style>
:root{--navy:#17324d;--blue:#2d6cdf;--light:#f4f7fb;--line:#d9e1ec;--good:#16834b;--bad:#c73535}*{box-sizing:border-box}body{margin:0;background:var(--light);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2733}.wrap{max-width:940px;margin:0 auto;padding:28px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 5px 18px #17324d0c}h1,h2,h3{color:var(--navy);margin-top:0}.muted{color:#627084}.bar{height:9px;background:#e6ebf2;border-radius:10px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;background:var(--blue);width:0;transition:.2s}.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:13px 15px;margin:11px 0;cursor:pointer;font-size:1rem}.option:hover:not(:disabled){border-color:var(--blue);background:#f7faff}.option.selected{border-color:var(--blue);background:#edf4ff}.option.correct{border-color:var(--good);background:#eaf8f0}.option.incorrect{border-color:var(--bad);background:#fff0f0}.option:disabled{cursor:default}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn{border:0;border-radius:9px;padding:11px 18px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8edf4;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.tag{display:inline-block;background:#eaf0f8;color:var(--navy);border-radius:999px;padding:4px 9px;font-size:.8rem;font-weight:700}.score{font-size:2.3rem;font-weight:800;color:var(--navy);margin:8px 0}.review{border-top:1px solid var(--line);padding:18px 0}.review h3{margin:0 0 8px}.answer{font-weight:700}.correct-answer{color:var(--good);font-weight:700;background:#eaf8f0;border-left:4px solid var(--good);padding:8px 10px;border-radius:6px}.wrong-answer{color:var(--bad);font-weight:700;background:#fff0f0;border-left:4px solid var(--bad);padding:8px 10px;border-radius:6px}.explain{background:#f6f8fb;border-left:4px solid var(--blue);padding:10px 13px;margin-top:9px}.intro li{margin:7px 0}@media(max-width:600px){.card{padding:18px}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body><main class="wrap"><div class="card" id="app"></div></main>
<script>
const questions = [
{"t":"History and origins","q":"What was one important effect of early written law codes?","o":["They ensured that customs no longer had any legal significance.","They created a uniform legal system for every neighbouring society.","They transferred all law-making power to courts rather than rulers.","They made legal rules more public without eliminating interpretation."],"a":3,"e":"Written codes increased publicity and stability, but they did not eliminate custom, interpretation, or differences between societies."},
{"t":"History and origins","q":"Why are the Napoleonic Codes relevant to the development of modern legal systems?","o":["They replaced domestic law with a single system of international rules.","They helped spread the idea of comprehensive written civil codes.","They made criminal punishment the central purpose of private law.","They established the doctrine that every judgment binds later courts."],"a":1,"e":"The Napoleonic Codes became an influential model for codified civil-law systems."},
{"t":"History and origins","q":"Which conclusion is most consistent with the significance of the Nuremberg trials?","o":["Domestic courts may never apply rules originating outside the state.","Individuals may bear responsibility for serious international crimes.","A treaty is valid only if every individual affected approves it.","International law concerns only disputes between private parties."],"a":1,"e":"Nuremberg helped develop modern international criminal accountability, including individual responsibility."},
{"t":"Definition of law","q":"A rule says that a person must submit an application before a stated deadline. How should the rule be classified?","o":["A permission created by the absence of a prohibition.","A right protected against interference by others.","A definition that gives a term its legal meaning.","A duty to perform a specified action."],"a":3,"e":"The rule requires an action, so it is an obligation or duty to do something."},
{"t":"Definition of law","q":"A regulation prohibits public access to a laboratory, but permits entry to paramedics during an emergency. The exception is best understood as:","o":["A separate sanction imposed for entering the laboratory.","A permission operating in specified circumstances.","A secondary source explaining the regulation.","A general right of access held by paramedics."],"a":1,"e":"Conduct normally prohibited may be permitted in particular circumstances; that does not automatically create a general right."},
{"t":"Definition of law","q":"Which statement best distinguishes a legal right from a permission?","o":["A right exists only when conduct is prohibited; a permission always creates compensation.","A right and a permission are interchangeable descriptions of the same legal position.","A right protects an interest; a permission allows conduct without necessarily protecting one.","A right is always a criminal rule; a permission is always a civil-law rule."],"a":2,"e":"A right concerns a legally protected interest, while a permission describes conduct that is allowed."},
{"t":"Definition of law","q":"A statute defines a “licensed operator” and then attaches duties to anyone who falls within that definition. What is the definition doing?","o":["It creates a moral standard that applies independently of the statute.","It identifies the conditions under which a legal term has meaning.","It supplies the sanction without identifying who is regulated.","It replaces the need to apply the statute to particular facts."],"a":1,"e":"A legal definition specifies the conditions that give a term legal meaning; later provisions may attach consequences."},
{"t":"Definition of law","q":"A company owns property and can sue in its own name, although it is not a human being. This illustrates the distinction between:","o":["A primary source and a secondary source.","A legal person and a natural person.","A public branch and a private branch of law.","A permission and an obligation."],"a":1,"e":"A company may be recognised as a legal person, whereas a natural person is a human being recognised as a legal subject."},
{"t":"Hart–Fuller debate","q":"A legislature enacts a law that is valid under the required procedures but is widely regarded as unjust. Which view most closely reflects Hart’s position?","o":["Its status can be determined only by asking whether it produces good outcomes.","Its injustice automatically prevents it from being law in every sense.","Its legal validity and its moral value should be analysed separately.","Its validity depends on whether citizens personally approve its content."],"a":2,"e":"Hart’s positivist position separates the criteria of legal validity from moral evaluation."},
{"t":"Hart–Fuller debate","q":"Which pairing correctly reflects Hart’s distinction between basic duty rules and rules about the legal system?","o":["Rules concerning private parties; rules concerning state-to-state relations.","Rules made by courts; rules made only by international organisations.","Moral principles for judging law; customs that operate without official recognition.","Duties imposed on conduct; rules about identifying, changing, and applying rules."],"a":3,"e":"Primary rules impose duties. Secondary rules confer powers and address recognition, change, and adjudication."},
{"t":"Hart–Fuller debate","q":"A government publishes a rule clearly, but applies it to conduct that happened before the rule existed. Fuller would most directly criticise the rule for failing:","o":["The distinction between basic duty rules and rules about the legal system.","The rule against applying law to past conduct.","The rule applying generally.","The separation of public and private law."],"a":1,"e":"Non-retroactivity requires rules to guide conduct prospectively rather than punish past conduct under a later rule."},
{"t":"Hart–Fuller debate","q":"A legal system contains rules that are secret, contradictory, and impossible to follow. Which concern raised by Fuller best captures the problem?","o":["The system is defective only if its sanctions are too severe.","The system fails several requirements of basic standards a legal system should follow.","The system concerns morality only, not the structure of legal rules.","The system is necessarily valid because enacted rules cannot be criticised."],"a":1,"e":"Fuller’s principles include publicity, clarity, non-contradiction, and possibility of compliance, among others."},
{"t":"Branches and fields","q":"A regulator fines a company for breaching a statutory safety requirement. Which classification is most accurate?","o":["A tort matter because every fine compensates an injured claimant.","A public-law matter involving administrative regulation.","An international-law matter because the company is a legal person.","A private-law matter concerning only contractual performance."],"a":1,"e":"Regulatory enforcement by a state body is primarily public law, even if private parties are affected."},
{"t":"Branches and fields","q":"A customer becomes ill after eating at a restaurant. Which classification best reflects the possibility of overlapping fields?","o":["The facts cannot involve contract law unless a document was signed.","The facts may raise both contract and tort issues.","The facts fall exclusively under international private law.","The facts must be classified only as criminal law."],"a":1,"e":"A paid service may create contractual obligations, while illness may also raise tort questions concerning injury and fault."},
{"t":"Branches and fields","q":"Two companies in different countries dispute which country’s law governs their agreement and whether a judgment can be enforced abroad. This primarily raises:","o":["Domestic criminal-law issues concerning antisocial conduct.","Private international law issues of applicable law and enforcement.","Public international law issues concerning treaties between states only.","Constitutional-law issues concerning division of government powers."],"a":1,"e":"Private international law addresses jurisdiction, applicable law, and recognition or enforcement across borders."},
{"t":"Branches and fields","q":"Which example best illustrates international public law?","o":["Two neighbours contest ownership of a boundary wall.","A consumer seeks damages from a foreign online retailer.","A treaty creates obligations between several states.","A ministry issues building standards for local businesses."],"a":2,"e":"International public law concerns relations involving states and international organisations, including treaty obligations."},
{"t":"Branches and fields","q":"Which statement best captures the scope of EU law as described in an introductory legal classification?","o":["It is entirely separate from domestic law and never affects individuals.","It applies only to disputes between EU institutions and member states.","It consists only of treaties and cannot include secondary legislation.","It can regulate both public matters and private relationships within the EU."],"a":3,"e":"EU law includes public and private dimensions and includes primary and secondary forms of legislation."},
{"t":"Branches and fields","q":"An employer is sued after an employee negligently injures a customer while working. Which concept from tort law is most relevant to the employer’s possible responsibility?","o":["The principle that only intentional injuries can create liability.","Consideration exchanged for the employee’s contractual promise.","Liability for another person’s conduct in an employment relationship.","The rule that every criminal offence requires a jury."],"a":2,"e":"The notes identify situations where an employer may be liable for a tort committed by an employee, subject to the applicable requirements."},
{"t":"Branches and fields","q":"A person causes damage in circumstances where liability is imposed regardless of whether the person acted negligently. This is an example of:","o":["A purely contractual obligation.","A permission created by silence.","The reasonable-person test.","Strict liability."],"a":3,"e":"Strict liability may impose responsibility without requiring proof of fault, depending on the legal rule."},
{"t":"Legal analysis","q":"In a legal problem, which fact is most likely to be important to the legal question?","o":["A fact that makes the narrative more emotionally compelling to the reader.","A fact that helps establish an element of an applicable legal rule.","A fact mentioned first, regardless of its connection to the legal issue.","A fact that is interesting but cannot be proved or linked to any rule."],"a":1,"e":"Relevant facts matter because they help determine whether the elements of an applicable rule are satisfied; they also require evidence."},
{"t":"Legal analysis","q":"A rule applies if either condition A or condition B exists. The facts establish A but not B. What follows?","o":["The court must disregard A because B remains unproven.","The rule cannot apply unless both A and B are established.","The condition where only one needs to be met is satisfied, so the rule may apply on that basis.","The distinction is irrelevant because all legal conditions are cumulative."],"a":2,"e":"“Either/or” indicates condition where only one needs to be met: satisfying one is enough, assuming other elements are met."},
{"t":"Legal analysis","q":"A rule requires that a person be licensed and insured before operating a vehicle commercially. The person is licensed but uninsured. The conditions are:","o":["Discretionary, so the person chooses which condition to meet.","Cumulative, so the combined requirement is not satisfied.","Evidential only, so neither condition affects legal application.","Alternative, so the licence alone is sufficient."],"a":1,"e":"“And” indicates conditions that all must be met; every listed element must be met."},
{"t":"Legal analysis","q":"Which sequence best represents a sound legal analysis?","o":["Find a similar case first, then assume its outcome without comparing the facts.","Identify the issue, find the applicable rule, apply it to relevant facts, and reach a conclusion.","Describe every fact, discuss general morality, and leave the legal issue implicit.","State the conclusion, omit the rule, and select facts that support the preferred result."],"a":1,"e":"Legal analysis connects the issue, legal rule, facts, and conclusion rather than treating them as separate observations."},
{"t":"Civil and common law","q":"A court deciding a dispute begins with a detailed code, interprets its provisions, and treats earlier decisions as guidance rather than usually binding. This is most characteristic of:","o":["An international criminal tribunal.","A civil-law approach.","An exclusively customary system.","A common-law approach."],"a":1,"e":"Civil-law systems typically place comprehensive written codes at the centre, while precedent is generally not formally supreme."},
{"t":"Civil and common law","q":"A higher court has previously decided a materially similar issue. A lower court in the same system is asked to decide it again. Which feature is most associated with common law?","o":["The lower court may be bound by the applicable binding earlier decision.","The lower court must ignore the earlier decision because only statutes matter.","The lower court may follow it only when the result seems morally attractive.","The earlier decision is binding only if the parties signed an agreement about it."],"a":0,"e":"In a common-law system, decisions of higher courts may bind lower courts when the precedent applies."},
{"t":"Civil and common law","q":"A lawyer argues that an earlier case should not control because its legally significant facts differ from the current dispute. This technique is called:","o":["Codifying the precedent.","Showing why the earlier case is different.","Ratifying the precedent.","Repealing the precedent."],"a":1,"e":"Distinguishing argues that the earlier case does not govern because the relevant facts or legal issues are materially different."},
{"t":"Civil and common law","q":"Which comparison between judge-led and party-versus-party processes is most accurate?","o":["The two processes differ only in the language used for the final judgment.","The judge-led judge generally has a more active investigative role; the party-versus-party judge is more neutral between parties.","The party-versus-party judge investigates the facts independently; parties mainly observe the process.","The judge-led process always uses juries; the party-versus-party process never uses them."],"a":1,"e":"The notes contrast the more active judge in an judge-led process with the neutral referee role in an party-versus-party process."},
{"t":"Civil and common law","q":"A legal system is praised for stable, accessible written rules but criticised as slower to adapt to new technology. Which trade-off does this most closely describe?","o":["Judicial neutrality versus the existence of written legislation.","Private rights versus the existence of international treaties.","Predictability and stability versus flexibility and rapid adaptation.","Criminal punishment versus the absence of legal remedies."],"a":2,"e":"The notes present codification as supporting predictability and stability, while common-law development may adapt more flexibly."},
{"t":"Legal sources","q":"Which document is most clearly a source that explains or comments on the law?","o":["A regulation issued by an authorised ministry.","A scholarly article analysing how courts interpret a statute.","A judgment delivered by a recognised court.","A statute enacted by the national legislature."],"a":1,"e":"Secondary sources analyse or explain law. Statutes, regulations, and judgments are primary legal materials."},
{"t":"Legal sources","q":"A researcher finds two online summaries supporting the same proposition, but neither identifies the original law or court decision. What is the best next step?","o":["Prefer the summary with the more confident wording.","Trace the proposition to reliable primary sources and check that they remain in force.","Cite both summaries instead of locating the original legal authority.","Treat repetition as proof that the proposition is legally binding."],"a":1,"e":"Good legal research verifies claims against authoritative primary sources and checks their current status."},
{"t":"Legal sources","q":"Which institutional pairing is correct under division of government powers?","o":["The judiciary makes all legislation; the executive decides constitutional meaning.","The executive makes final judgments; the legislature enforces them.","The legislature makes or changes law; the executive puts law into action.","The legislature investigates every individual dispute as a court."],"a":2,"e":"The notes describe the legislative branch as making or changing law, the executive as implementing it, and the judiciary as deciding cases."},
{"t":"Hierarchy and norm conflicts","q":"A regulation conflicts with a statute on the same subject, and both apply to the same facts. Which principle generally resolves the conflict?","o":["No principle applies because regulations and statutes cannot conflict.","Lex superior: the higher-ranking statute prevails over the regulation.","Lex posterior: the regulation prevails simply because it is easier to amend.","Lex specialis: the regulation always prevails because it is more detailed."],"a":1,"e":"Lex superior gives priority to a higher-level norm over a lower-level norm."},
{"t":"Hierarchy and norm conflicts","q":"A general driving rule conflicts with a more specific rule governing passenger transport. If both are otherwise valid, which principle most directly supports applying the passenger-transport rule?","o":["Lex posterior: specificity proves that the rule was enacted later.","Stare decisis: only a previous judgment can resolve the conflict.","Lex specialis: the specific rule prevails over the general rule.","Lex superior: every specific rule ranks above every general rule."],"a":2,"e":"Lex specialis gives priority to a specific rule over a general rule in the relevant area."},
{"t":"Hierarchy and norm conflicts","q":"A new statute conflicts with an older statute, and neither is clearly higher in rank or more specific. Which principle may resolve the conflict?","o":["Lex specialis: the newer rule is always treated as more specific.","Lex superior: the older rule automatically has greater authority.","Customary law: the conflict is decided by community practice.","Lex posterior: the later rule generally prevails over the earlier one."],"a":3,"e":"Where rules are otherwise comparable, lex posterior gives priority to the later rule."},
{"t":"OSCOLA and citation","q":"Which practice is most consistent with OSCOLA legal writing?","o":["List sources only at the end without connecting them to particular claims.","Cite borrowed propositions in footnotes and identify the relevant legal authority.","Use quotation marks for every legal proposition, even when it is your own analysis.","Cite only direct quotations; paraphrased ideas do not require references."],"a":1,"e":"Borrowed quotations, paraphrases, and ideas should be attributed, normally through footnotes, with appropriate authority."},
{"t":"OSCOLA and citation","q":"Which information is most important when citing a case?","o":["The university where the researcher first encountered the judgment.","Only the date, because case names are not used in legal citation.","The case name together with the identifying report or neutral citation or report reference.","The author’s name and the publisher’s city, as for a book."],"a":2,"e":"Case citations identify the decision through the case name and appropriate report or neutral citation details."},
{"t":"HIRAC and legal writing","q":"In a HIRAC response, what is the main purpose of the section where the rules are applied to the facts?","o":["To list legal sources without explaining how they affect the client’s situation.","To introduce the topic without stating the legal question being answered.","To add new facts that were not considered in the analysis.","To match each relevant part of the rule to the facts and address competing arguments."],"a":3,"e":"Application is the core analytical step: it tests the rule element by element against the facts and may consider both sides."},
{"t":"HIRAC and legal writing","q":"Which opening best fulfils the function of an introduction to a legal argument?","o":["It states only the final answer because explaining the route would reduce persuasion.","It identifies the purpose, legal question, and order in which the argument will proceed.","It presents several unrelated legal sources before telling the reader what is being discussed.","It begins with every factual detail and postpones the issue until the conclusion."],"a":1,"e":"An effective introduction tells the reader why the argument is being made, what question it addresses, and how it is structured."},
{"t":"HIRAC and legal writing","q":"Which sentence best demonstrates active voice and legal clarity?","o":["The rejection of the application is something that should occur on the issue.","It is clearly the case that the application is one which should be rejected.","The court should reject the application because the claimant lacks the right to bring the claim.","The application should be rejected by the court because the claimant lacks the right to bring the claim."],"a":2,"e":"The first sentence uses a clear subject and verb, avoids unnecessary turning actions into nouns, and states the reasoning directly."},
{"t":"HIRAC and legal writing","q":"Which practice would most undermine clear logical flow in a legal argument?","o":["Addressing a relevant counterargument before returning to the main position.","Changing topics between paragraphs without showing the reader the route of the argument or explaining the connection.","Ending each application paragraph by stating its interim conclusion.","Using headings that reflect the sequence announced in the introduction."],"a":1,"e":"Coherence requires logical progression and clear connections between points; unexplained topic shifts make the reasoning difficult to follow."}
];
let index=0,answers=Array(questions.length).fill(null);
const app=document.getElementById('app');
function renderIntro(){app.innerHTML=`<h1>First-Year Law Mock Exam</h1><p class="muted">40 questions • Choose one answer per question • Results and explanations appear at the end.</p><ul class="intro"><li>Questions test understanding and application rather than answer-pattern recognition.</li><li>Answer choices are deliberately similar in length and plausibility.</li><li>Some questions use short scenarios rather than simple recall.</li><li>Your answers are not submitted anywhere.</li></ul><button class="btn" onclick="start()">Start exam</button>`}
function start(){index=0;answers=Array(questions.length).fill(null);renderQuestion()}
function renderQuestion(){let x=questions[index], chosen=answers[index];app.innerHTML=`<span class="tag">${x.t}</span><h1>Question ${index+1} of ${questions.length}</h1><div class="bar"><div class="fill" style="width:${(index+1)/questions.length*100}%"></div></div><h2>${x.q}</h2><div>${x.o.map((v,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="prev()" ${index===0?'disabled':''}>Previous</button><button class="btn" onclick="next()" ${chosen===null?'disabled':''}>${index===questions.length-1?'Finish':'Next'}</button></div>`}
function choose(i){answers[index]=i;renderQuestion()}
function prev(){if(index>0){index--;renderQuestion()}}
function next(){if(answers[index]===null)return;if(index<questions.length-1){index++;renderQuestion()}else renderResults()}
function renderResults(){let score=answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0);app.innerHTML=`<h1>Results</h1><p class="score">${score} / ${questions.length}</p><p class="muted">${Math.round(score/questions.length*100)}% correct</p><div class="actions"><button class="btn" onclick="renderReview()">Review answers</button><button class="btn secondary" onclick="start()">Retry exam</button></div>`}
function renderReview(){let score=answers.reduce((n,a,i)=>n+(a===questions[i].a?1:0),0);app.innerHTML=`<h1>Answer review</h1><p class="score">${score} / ${questions.length}</p>${questions.map((x,i)=>{let ok=answers[i]===x.a;return `<section class="review"><h3>${i+1}. ${x.q}</h3><p class="correct-answer">Correct answer: ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</p><p class="${ok?'correct-answer':'wrong-answer'}">Your answer: ${answers[i]===null?'Not answered':String.fromCharCode(65+answers[i])+'. '+x.o[answers[i]]}</p><div class="explain">${x.e}</div></section>`}).join('')}<button class="btn" onclick="start()">Retry exam</button>`}
renderIntro();
</script>
</body>
</html>
